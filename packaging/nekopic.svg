<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="nekopic-title nekopic-desc">
  <title id="nekopic-title">NekoPic</title>
  <desc id="nekopic-desc">A warm peach camera aperture with cat ears on a graphite rounded square.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2d2f"/>
      <stop offset="1" stop-color="#181a1b"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7cdb1"/>
      <stop offset="1" stop-color="#edbc9d"/>
    </linearGradient>
    <clipPath id="lens">
      <circle cx="128" cy="142" r="60"/>
    </clipPath>
  </defs>

  <!-- Graphite app tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>

  <!-- Cat ears -->
  <path d="M68 96 L70 42 Q71 34 78 39 L118 70 Z" fill="url(#peach)"/>
  <path d="M188 96 L186 42 Q185 34 178 39 L138 70 Z" fill="url(#peach)"/>
  <path d="M80 82 L81 51 L105 70 Z" fill="#1e2022" opacity="0.55"/>
  <path d="M176 82 L175 51 L151 70 Z" fill="#1e2022" opacity="0.55"/>

  <!-- Lens ring -->
  <circle cx="128" cy="142" r="68" fill="none" stroke="url(#peach)" stroke-width="10"/>

  <!-- Aperture blades, clipped to the lens -->
  <g clip-path="url(#lens)">
    <circle cx="128" cy="142" r="60" fill="#141617"/>
    <g transform="translate(128 142)" fill="#a45934">
      <path d="M0 -60 L52 -30 L20 -6 Z"/>
      <path d="M0 -60 L52 -30 L20 -6 Z" transform="rotate(60)"/>
      <path d="M0 -60 L52 -30 L20 -6 Z" transform="rotate(120)"/>
      <path d="M0 -60 L52 -30 L20 -6 Z" transform="rotate(180)"/>
      <path d="M0 -60 L52 -30 L20 -6 Z" transform="rotate(240)"/>
      <path d="M0 -60 L52 -30 L20 -6 Z" transform="rotate(300)"/>
    </g>
    <!-- Cat-eye pupil -->
    <circle cx="128" cy="142" r="17" fill="url(#peach)"/>
    <ellipse cx="128" cy="142" rx="4.5" ry="13" fill="#181a1b"/>
  </g>
</svg>
